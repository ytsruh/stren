# Config file for [Air](https://github.com/air-verse/air) in TOML format
# Install: go install github.com/air-verse/air@latest
# Usage: air

root = "."
tmp_dir = "tmp"

[build]
pre_cmd = []
cmd = "./tailwindcss -i ./styles/input.css -o ./public/css/styles.css --minify && templ generate && go build -o ./tmp/main ./cmd/main.go"
post_cmd = []
bin = "tmp/main"
full_bin = "./tmp/main"
args_bin = []
include_ext = ["go", "templ", "css"]
exclude_dir = ["tmp", "public","client"]
include_dir = []
include_file = []
exclude_file = ["styles/basecoat.css"]
exclude_regex = ["_test\\.go", "_templ\\.go"]
exclude_unchanged = true
follow_symlink = true
log = "air.log"
poll = false
poll_interval = 500
delay = 0
stop_on_error = true
send_interrupt = false
kill_delay = 500
rerun = false
rerun_delay = 500

[log]
time = false
main_only = false
silent = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[proxy]
enabled = true
proxy_port = 8090
app_port = 8080
